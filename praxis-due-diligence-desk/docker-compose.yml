# Phase 0: just the API (runs with the `fake` LLM provider, no keys needed).
#   docker compose up --build   ->   curl -XPOST localhost:8000/dossiers.md -d '{"subject":"Acme Robotics"}'
#
# Phase 1 adds: qdrant (vectors), postgres (dossier + run history), worker (ingestion).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PRAXIS_LLM_PROVIDER: ${PRAXIS_LLM_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
