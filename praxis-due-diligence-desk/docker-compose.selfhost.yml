# One-command self-host: api + worker + mcp + qdrant + redis + postgres.
# Starts with NO keys (fake LLM + hashing embedder) — set real provider env
# vars to use a real model. Unlike docker-compose.yml (SQLite, dev-only),
# this is the full production-shaped stack, migrations included.
#
#   docker compose -f docker-compose.selfhost.yml up --build
#   curl -s localhost:8000/health
#   curl -s localhost:8000/ready
#   curl -s -XPOST localhost:8000/dossiers.md -d '{"subject":"Acme Robotics"}'
#
# PRODUCTION.md covers the managed-service equivalent (Neon/Qdrant Cloud/
# Upstash) for an actual deploy — this file self-hosts every dependency.
services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      PRAXIS_DATABASE_URL: postgresql+asyncpg://praxis:praxis@postgres:5432/praxis
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PRAXIS_LLM_PROVIDER: ${PRAXIS_LLM_PROVIDER:-fake}
      PRAXIS_EMBEDDING_PROVIDER: ${PRAXIS_EMBEDDING_PROVIDER:-fake}
      PRAXIS_QDRANT_URL: http://qdrant:6333
      PRAXIS_REDIS_URL: redis://redis:6379
      PRAXIS_DATABASE_URL: postgresql+asyncpg://praxis:praxis@postgres:5432/praxis
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3

  worker:
    build: .
    command: ["arq", "praxis.worker.WorkerSettings"]
    environment:
      PRAXIS_LLM_PROVIDER: ${PRAXIS_LLM_PROVIDER:-fake}
      PRAXIS_EMBEDDING_PROVIDER: ${PRAXIS_EMBEDDING_PROVIDER:-fake}
      PRAXIS_QDRANT_URL: http://qdrant:6333
      PRAXIS_REDIS_URL: redis://redis:6379
      PRAXIS_DATABASE_URL: postgresql+asyncpg://praxis:praxis@postgres:5432/praxis
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 1  # the ingestion queue isn't sharded yet — one replica only

  mcp:
    build: .
    command: ["praxis", "mcp"]
    ports:
      - "8001:8001"
    environment:
      PRAXIS_LLM_PROVIDER: ${PRAXIS_LLM_PROVIDER:-fake}
      PRAXIS_EMBEDDING_PROVIDER: ${PRAXIS_EMBEDDING_PROVIDER:-fake}
      PRAXIS_QDRANT_URL: http://qdrant:6333
      PRAXIS_MCP_TRANSPORT: streamable-http
      PRAXIS_MCP_HOST: 0.0.0.0
      PRAXIS_MCP_PORT: "8001"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_started
    # Own in-memory corpus unless PRAXIS_QDRANT_URL points at the same real
    # backend api/worker use — same caveat as the CLI (see docker-compose.yml).

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: praxis
      POSTGRES_DB: praxis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:
  postgres_data:
