apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: praxis
  labels:
    app: praxis
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: praxis
      component: api
  template:
    metadata:
      labels:
        app: praxis
        component: api
    spec:
      serviceAccountName: praxis
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # matches `useradd --uid 10001 praxis` in the Dockerfile
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/hemarani-mysore/praxis:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: praxis-config
            - secretRef:
                name: praxis-secrets
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Same mounts as the api container below: in the dev overlay,
          # PRAXIS_DATABASE_URL is a SQLite file under /data — the migration
          # needs that mount too, not just the main container.
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: ghcr.io/hemarani-mysore/praxis:latest
          command: ["uvicorn", "praxis.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: praxis-config
            - secretRef:
                name: praxis-secrets
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem leaves /tmp read-only too unless it's its
            # own mount — anything in the stack that writes a temp file
            # (uvicorn, a library's cache, ...) would otherwise crash the
            # container. Cheap, standard pairing for this security setting.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
