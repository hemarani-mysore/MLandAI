# Never a real secret — copy to secret.yaml (gitignored), fill in real values,
# and `kubectl apply -f` it once per cluster (kustomize deliberately doesn't
# generate secrets from this file, to avoid ever committing real values).
# PRAXIS_DATABASE_URL lives here too, not the configmap, since a real
# Postgres URL embeds a password.
apiVersion: v1
kind: Secret
metadata:
  name: praxis-secrets
  namespace: praxis
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  NEBIUS_API_KEY: ""
  PRAXIS_DATABASE_URL: "" # e.g. postgresql+asyncpg://user:pass@host:5432/praxis (Neon)
