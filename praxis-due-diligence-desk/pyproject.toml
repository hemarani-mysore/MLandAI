[project]
name = "praxis"
version = "0.1.0"
description = "Praxis — a production due-diligence research desk (multi-agent, RAG, MCP, evals)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.60",
    "langchain>=0.3.14",
    "langchain-core>=0.3.29",
    "langchain-openai>=0.2.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "qdrant-client>=1.12",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "sqlalchemy[asyncio]>=2",
    "aiosqlite>=0.20",
    "langgraph-checkpoint-sqlite>=2",
    "arq>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "fakeredis>=2.20",
]
# Optional heavier retrieval backends (not needed for the deterministic path / CI):
rerank = ["sentence-transformers>=3.0"]
ragas = ["ragas>=0.2", "datasets>=3.0"]

[project.scripts]
praxis = "praxis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]  # B008: Depends(...) in defaults is the FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src/praxis"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true

[[tool.mypy.overrides]]
# numpy 2.2+ stubs use 3.12-only syntax; we only need it as an opaque dep.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
