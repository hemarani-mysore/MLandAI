name: praxis-ci

on:
  push:
    branches: [praxis-due-diligence-desk]
  pull_request:
    paths:
      - "praxis-due-diligence-desk/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: praxis-due-diligence-desk

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: RAG retrieval eval (deterministic, gated)
        run: uv run python evals/rag_eval.py --gate

      - name: Memo-structure eval (deterministic, gated)
        run: uv run python evals/memo_structure_eval.py --gate

      - name: LLM-as-judge vs expert labels (recorded, offline)
        run: uv run python evals/memo_eval.py --split test --gate

      - name: Citation-integrity self-check
        run: uv run python evals/citation_eval.py --gate

      - name: Seeded-error detection (recorded, offline)
        run: uv run python evals/redteam_eval.py --gate

  mcp-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: MCP server + parity + external-tools contract tests
        run: >
          uv run pytest
          tests/test_mcp_server.py
          tests/test_mcp_parity.py
          tests/test_mcp_tools_loader.py
          tests/test_researcher_web_fallback.py
          -v

  postgres-contract:
    runs-on: ubuntu-latest
    # No Postgres exists on the machine this was developed on — this job is
    # the actual verification that PRAXIS_DATABASE_URL=postgresql+asyncpg://
    # really works, not just that the URL string is well-formed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
          POSTGRES_DB: praxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRAXIS_DATABASE_URL: postgresql+asyncpg://praxis:praxis@localhost:5432/praxis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Apply migrations to the real Postgres service container
        run: uv run alembic upgrade head
      - name: Confirm the models and the migration haven't drifted
        run: uv run alembic check
      - name: DB-touching tests against real Postgres
        run: >
          uv run pytest
          tests/test_db_models.py
          tests/test_db_url.py
          tests/test_db_engine_real.py
          tests/test_api_runs.py
          -v

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hemarani-mysore/praxis
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          # Not covered by `defaults.run.working-directory` — that only
          # applies to `run:` steps, not action inputs like this one.
          context: praxis-due-diligence-desk
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Image sanity check
        run: docker run --rm "ghcr.io/hemarani-mysore/praxis:${{ github.sha }}" python -c "import praxis; print(praxis.__version__)"

  # Phase 5 will also add: kubeconform/kustomize validation, and a `kind`
  # smoke test of deploy/k8s (slices 3-4).
