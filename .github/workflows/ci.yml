name: praxis-ci

on:
  push:
    branches: [praxis-due-diligence-desk]
  pull_request:
    paths:
      - "praxis-due-diligence-desk/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: praxis-due-diligence-desk

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

  # Phase 4 will add: eval-gate (LLM-as-judge F1 + RAGAS on a fixed slice).
  # Phase 5 will add: docker build -> GHCR, and `kind` smoke test of deploy/k8s.
