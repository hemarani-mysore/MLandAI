name: praxis-ci

on:
  push:
    branches: [praxis-due-diligence-desk]
  pull_request:
    paths:
      - "praxis-due-diligence-desk/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: praxis-due-diligence-desk

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: RAG retrieval eval (deterministic, gated)
        run: uv run python evals/rag_eval.py --gate

      - name: Memo-structure eval (deterministic, gated)
        run: uv run python evals/memo_structure_eval.py --gate

      - name: LLM-as-judge vs expert labels (recorded, offline)
        run: uv run python evals/memo_eval.py --split test --gate

      - name: Citation-integrity self-check
        run: uv run python evals/citation_eval.py --gate

      - name: Seeded-error detection (recorded, offline)
        run: uv run python evals/redteam_eval.py --gate

  mcp-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: MCP server + parity + external-tools contract tests
        run: >
          uv run pytest
          tests/test_mcp_server.py
          tests/test_mcp_parity.py
          tests/test_mcp_tools_loader.py
          tests/test_researcher_web_fallback.py
          -v

  postgres-contract:
    runs-on: ubuntu-latest
    # No Postgres exists on the machine this was developed on — this job is
    # the actual verification that PRAXIS_DATABASE_URL=postgresql+asyncpg://
    # really works, not just that the URL string is well-formed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
          POSTGRES_DB: praxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRAXIS_DATABASE_URL: postgresql+asyncpg://praxis:praxis@localhost:5432/praxis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Apply migrations to the real Postgres service container
        run: uv run alembic upgrade head
      - name: Confirm the models and the migration haven't drifted
        run: uv run alembic check
      - name: DB-touching tests against real Postgres
        run: >
          uv run pytest
          tests/test_db_models.py
          tests/test_db_url.py
          tests/test_db_engine_real.py
          tests/test_api_runs.py
          -v

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hemarani-mysore/praxis
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          # Not covered by `defaults.run.working-directory` — that only
          # applies to `run:` steps, not action inputs like this one.
          context: praxis-due-diligence-desk
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Image sanity check
        run: docker run --rm "ghcr.io/hemarani-mysore/praxis:${{ github.sha }}" python -c "import praxis; print(praxis.__version__)"

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sL -o /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin
      - name: Install kubeconform
        run: |
          curl -sL -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz"
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Validate dev overlay
        run: kustomize build deploy/k8s/overlays/dev | kubeconform -strict -summary
      - name: Validate prod overlay
        run: kustomize build deploy/k8s/overlays/prod | kubeconform -strict -summary

  kind-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local only — same tag deploy/k8s/base's manifests reference)
        uses: docker/build-push-action@v5
        with:
          context: praxis-due-diligence-desk
          push: false
          load: true
          tags: ghcr.io/hemarani-mysore/praxis:latest
      - name: Install kustomize
        run: |
          curl -sL -o /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin
      - uses: helm/kind-action@v1
        with:
          cluster_name: praxis-smoke
      - name: Load the local image into kind
        # Every container in base/ sets imagePullPolicy: IfNotPresent
        # specifically so this loaded image is used instead of kubelet trying
        # (and failing) to pull `:latest` fresh from GHCR.
        run: kind load docker-image ghcr.io/hemarani-mysore/praxis:latest --name praxis-smoke
      - name: Deploy the dev overlay
        run: kustomize build deploy/k8s/overlays/dev | kubectl apply -f -
      - name: Wait for the datastores first, then the app deployments
        run: |
          kubectl -n praxis rollout status statefulset/qdrant --timeout=120s
          kubectl -n praxis rollout status deployment/redis --timeout=60s
          kubectl -n praxis rollout status deployment/api --timeout=180s
          kubectl -n praxis rollout status deployment/worker --timeout=120s
          kubectl -n praxis rollout status deployment/mcp --timeout=120s
      - name: Smoke test over a port-forward (fake provider — zero cost, zero external calls)
        run: |
          kubectl -n praxis port-forward svc/api 8000:8000 &
          for i in $(seq 1 15); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          curl -sf localhost:8000/ready
          curl -sf -X POST localhost:8000/dossiers \
            -H 'content-type: application/json' \
            -d '{"subject":"Acme Robotics"}'
      - name: NetworkPolicy — an unrelated pod cannot reach qdrant
        run: |
          kubectl -n praxis run debug --image=busybox:1.36 --restart=Never --command -- sleep 300
          kubectl -n praxis wait --for=condition=Ready pod/debug --timeout=60s
          kubectl -n praxis exec debug -- timeout 5 nc -zv qdrant 6333 && exit 1 || echo "correctly blocked"
      - name: NetworkPolicy — the api pod (an allowed label) can reach qdrant
        run: >
          kubectl -n praxis exec deploy/api --
          python -c "import socket; s = socket.create_connection(('qdrant', 6333), timeout=5); print('connected'); s.close()"

  deploy:
    runs-on: ubuntu-latest
    # Deploy-ready, not deployed: this branch's own push trigger never
    # matches `main`, so this job is a guaranteed no-op for as long as this
    # branch exists on its own — genuinely live only after a merge to `main`
    # *and* FLY_API_TOKEN being added as a repo secret (checked below too, so
    # it also skips cleanly on `main` before that secret exists).
    if: github.ref == 'refs/heads/main'
    needs: [quality, eval-gate, build]
    steps:
      - uses: actions/checkout@v4
      - name: Check for FLY_API_TOKEN
        id: has_token
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "FLY_API_TOKEN is not set as a repo secret yet — skipping deploy." >&2
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.has_token.outputs.present == 'true'
      - name: Deploy api
        if: steps.has_token.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config deploy/fly/api.toml --dockerfile Dockerfile --remote-only
      - name: Deploy mcp
        if: steps.has_token.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config deploy/fly/mcp.toml --dockerfile Dockerfile --remote-only
